<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>

.note{margin-top:14px;padding-top:12px;border-top:0.5px solid rgba(255,255,255,.08);font-size:11px;color:#8b9099;display:flex;gap:18px}
.bad{color:#FF8F6B;font-family:var(--font-mono);font-size:11px}
</style></head><body>
<div class="grid">
