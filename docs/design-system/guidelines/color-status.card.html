<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;font-family:var(--font-ui);background:#1c1d21;color:#ececee}

.sw{width:96px}.sw .c{height:52px;border-radius:6px;border:0.5px solid rgba(255,255,255,.14)}
.sw .n{font-size:10.5px;margin-top:6px;color:#9a9aa2;line-height:1.35}
.sw .h{font-family:var(--font-mono);font-size:9.5px;color:#6c6c74;letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><div class="c" style="background:#3ec46d"></div><div class="n">ok</div><div class="h">--ok</div></div><div class="sw"><div class="c" style="background:#e0a23b"></div><div class="n">warn (승인)</div><div class="h">--warn</div></div><div class="sw"><div class="c" style="background:#e0563b"></div><div class="n">down (연결끊김)</div><div class="h">--down</div></div><div class="sw"><div class="c" style="background:#ff4d4a"></div><div class="n">urgent</div><div class="h">--urgent</div></div><div class="sw"><div class="c" style="background:#7cfc5a"></div><div class="n">step-done</div><div class="h">--step-done</div></div></div></body></html>
