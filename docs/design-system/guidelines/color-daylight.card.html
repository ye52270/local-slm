<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;font-family:var(--font-ui);background:#fff;color:#1c1d21}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:96px}.sw .c{height:52px;border-radius:6px;border:0.5px solid rgba(28,29,33,.14)}
.sw .n{font-size:10.5px;margin-top:6px;color:#5b616c;line-height:1.35}
.sw .h{font-family:var(--font-mono);font-size:9.5px;color:#8b9099;letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><div class="c" style="background:#F2F3F5"></div><div class="n">page</div><div class="h">--day-page</div></div><div class="sw"><div class="c" style="background:#FFFFFF"></div><div class="n">card</div><div class="h">--day-card</div></div><div class="sw"><div class="c" style="background:#F7F8FA"></div><div class="n">sunken</div><div class="h">--day-sunken</div></div><div class="sw"><div class="c" style="background:rgba(28,29,33,.10)"></div><div class="n">border 10%</div><div class="h">--day-border</div></div><div class="sw"><div class="c" style="background:#3f6fd8"></div><div class="n">accent</div><div class="h">--day-accent</div></div></div></body></html>
