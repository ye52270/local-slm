<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;font-family:var(--font-ui);background:#1c1d21;color:#ececee}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:96px}.sw .c{height:52px;border-radius:6px;border:0.5px solid rgba(255,255,255,.14)}
.sw .n{font-size:10.5px;margin-top:6px;color:#9a9aa2;line-height:1.35}
.sw .h{font-family:var(--font-mono);font-size:9.5px;color:#6c6c74;letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><div class="c" style="background:#5b8def"></div><div class="n">accent</div><div class="h">--accent</div></div><div class="sw"><div class="c" style="background:rgba(91,141,239,.14)"></div><div class="n">accent-bg 14%</div><div class="h">--accent-bg</div></div><div class="sw"><div class="c" style="background:#4a89ff"></div><div class="n">progress</div><div class="h">--progress-accent</div></div><div class="sw"><div class="c" style="background:#8fb0ff"></div><div class="n">tag-follow</div><div class="h">--tag-follow-text</div></div><div class="sw"><div class="c" style="background:#3f6fd8"></div><div class="n">라이트 accent</div><div class="h">--day-accent</div></div></div></body></html>
