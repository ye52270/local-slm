<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>html,body{margin:0}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 152px;overflow:hidden}.mark{background:var(--ink-900);display:grid;place-items:center;background-image:var(--texture-dot-dark);background-size:16px 16px}.mark span{font-family:var(--font-ui);font-weight:800;font-size:214px;letter-spacing:-.045em;color:var(--grey-100);line-height:1;white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style></head><body><div class="tile"><div class="mark"><span>몰두봇</span></div><div class="strip"><div style="background:#4BDD5E"></div><div style="background:#E9C15A"></div><div style="background:#FF8B7D"></div><div style="background:#497ED7"></div></div></div></body></html>
